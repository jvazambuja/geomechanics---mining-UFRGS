name: Atualizar Artigos e Publicar Site

on:
  schedule:
    - cron: '0 0 1 * *' 
  workflow_dispatch: 

# Concede permissões para o GitHub Actions publicar no Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Instalar dependências
        run: pip install requests mkdocs-material
        
      - name: Extrair publicações via OpenAlex
        run: python atualizar_artigos.py
        
      - name: Construir e Publicar o Site no GitHub Pages
        run: mkdocs gh-deploy --force
