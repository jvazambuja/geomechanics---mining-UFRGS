name: Atualizar Artigos e Publicar Site

on:
  schedule:
    - cron: '0 0 1 * *' 
  workflow_dispatch: 

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          # Fundamental para a action de commit funcionar corretamente
          fetch-depth: 0 
          ref: main
        
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Instalar dependências
        run: |
          pip install requests 
          pip install mkdocs-material
        
      - name: Extrair publicações via OpenAlex (Script Python)
        run: python atualizar_artigos.py
        
      - name: Salvar os novos artigos (Commit Automático à prova de falhas)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Atualização automática dos artigos Open Access"
          # Ele vai rastrear o arquivo independente de estar na raiz ou na pasta docs/
          file_pattern: "docs/publicacoes.md publicacoes.md" 
        
      - name: Construir e Publicar o Site no GitHub Pages (MkDocs)
        run: mkdocs gh-deploy --force
